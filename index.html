:root{color-scheme:light;--ink:#183c3e;--green:#154d50;--paper:#f7f6ef}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;font-size:19px;line-height:1.8}header{position:sticky;top:0;z-index:10;background:var(--green);color:white;padding:18px 22px}header div{max-width:720px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}header small{font-size:14px;letter-spacing:.08em}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer;border:1px solid #aac0ba;border-radius:10px;background:white;color:var(--ink);padding:10px 18px;min-height:48px}header button{font-size:16px}main{max-width:720px;margin:auto;padding:28px 22px 150px}h1{font-size:clamp(29px,6vw,40px);line-height:1.35;margin:12px 0 24px}h2{font-size:23px;margin:28px 0 10px}.eyebrow{font-size:15px;color:#4a6661;letter-spacing:.1em}.lead{font-size:23px;font-weight:600}.box{background:#e7efea;border-left:5px solid var(--green);padding:16px 20px;margin:22px 0;border-radius:0 12px 12px 0}.notice{background:#fff0cc;border-left-color:#8a6018}li{margin:10px 0}code{background:#e4e9e3;padding:3px 7px;border-radius:5px;font-size:19px;white-space:normal}a{color:#145b65}.cta{display:block;text-align:center;padding:14px;background:var(--green);color:white;border-radius:12px;text-decoration:none;font-weight:bold}footer{position:fixed;bottom:0;left:0;right:0;background:#fffffff5;border-top:1px solid #cdd8d0;padding:12px 18px;padding-bottom:max(12px,env(safe-area-inset-bottom))}nav{max-width:720px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}nav span{font-size:16px}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #ad7419;outline-offset:4px}#menu{max-width:720px;margin:0 auto;padding:20px;display:grid;gap:10px}#menu[hidden]{display:none}#menu button{text-align:left}.row{display:grid;grid-template-columns:32px 1fr;gap:10px;border-bottom:1px solid #cbd6ce;padding:10px 0}.draft{font-size:14px;margin-top:12px;color:#68531f} @media(min-width:760px){main{padding-top:44px}}
figure{margin:24px 0}figure img{width:100%;height:auto;border-radius:10px}figcaption{font-size:15px;color:#4a6661}.practice{padding:18px;border:2px solid #93aba0;border-radius:12px}.input-row{display:flex;gap:8px;flex-wrap:wrap}input{font:inherit;min-width:0;width:100%;padding:12px;border:1px solid #78978b;border-radius:8px}#practice-reply{background:white;padding:14px;overflow-wrap:anywhere}summary{padding:14px 0;font-weight:600;cursor:pointer}details{border-block:1px solid #cbd6ce;margin:20px 0}/* 每頁共用黑潮識別，捲動時固定顯示；保持原始圖檔比例。 */
header .brand{margin:0;gap:12px;min-width:0;justify-content:flex-start}.brand-logo{width:72px;height:auto;display:block;flex-shrink:0}header button{flex-shrink:0}html{scroll-padding-top:120px}.source-links{font-size:16px}.type-section{margin:30px 0;padding-top:8px;border-top:2px solid #bacdc1}.type-section .row{font-size:18px}@media(max-width:350px){header{padding:12px 14px}header .brand{gap:8px}.brand-logo{width:56px}header small{font-size:12px}header button{padding:10px 12px}}.category-note{display:block;font-size:16px;line-height:1.7;margin-top:6px;color:#4a6661}/* 以交錯底色區分練習題，答案區不另加分隔線。 */

</style></head><body><header><div><div class="brand"><img class="brand-logo" src="assets/kuroshio-logo-white.png" alt="黑潮海洋文教基金會"><small>ICC 淨灘<br>行動手冊</small></div><button id="toggle" aria-expanded="false" aria-controls="menu">主題目錄</button></div></header><section id="menu" aria-label="主題目錄" hidden></section><main id="content"></main><footer><nav aria-label="翻頁"><button id="prev">← 上一頁</button><span id="progress" aria-live="polite"></span><button id="next">下一頁 →</button></nav></footer><script>
// 教學內容與頁面導覽分開，之後修改文案不需改動翻頁程式。
const categories=['寶特瓶','塑膠瓶蓋','其他飲料與食物容器','非食物的瓶罐與容器','塑膠提袋','食品包裝袋','吸管','外帶飲料杯','免洗餐具','鐵鋁罐','鋁箔包／利樂包','玻璃瓶','牙刷','針筒／針頭','菸蒂','打火機','釣魚用具','魚鉤','漁業浮球／浮筒／漁船防碰墊','漁網與繩子'];
// 五大類型依原教材第15頁；代號沿用Bot的固定20類。
const wasteTypes=[
{title:'01｜生活垃圾與遊憩行為',relation:'喝飲料、吃東西、購物、清潔與使用日常用品，都可能留下這些物件。',codes:'ABCDEFGHIJKL'},
{title:'02｜抽菸',relation:'從菸蒂與打火機，連結吸菸、棄置與垃圾移動的路徑。',codes:'OP'},
{title:'03｜漁業與休閒漁釣',relation:'從釣魚、捕魚、養殖與船舶使用的工具，辨認相關活動的線索。',codes:'QRST'},
{title:'04｜醫療／個人衛生用品',relation:'從醫療照護與個人清潔用品，思考使用後的處理方式。',codes:'MN'},
{title:'05｜當地關心的廢棄物',relation:'依海岸特性，另外關注在地問題，例如數量特別多的廢棄物、當地特殊活動及使用者遺留物等。',codes:''}
];
const categoryNotes={C:'如優酪乳瓶、鮮奶瓶、生鮮肉品托盤等',D:'如清潔用品、美妝用品、機油瓶、油桶等。',I:'包括盤、便當盒、筷子、刀叉與湯匙等。',F:'糖果、零食包裝袋等'};
const pages=[
['今天要完成什麼？',`<p class="lead">把海灘上的垃圾帶走，也把觀察留下來。</p><p>今天除了淨灘，我們也會記錄廢棄物的種類、數量與重量，最後一起看看：這片海岸上有哪些人類活動留下的痕跡？</p><p><strong>東華大學環境社會學課程</strong><br>2026 年 11 月 6 日 · 花蓮北濱海灘</p><div class="box"><strong>今天的三個任務</strong><ol><li>安全地參與淨灘。</li><li>小組合作，留下可核對的記錄。</li><li>從結果提出觀察與問題。</li></ol></div><p>跟著講師說明，使用底部按鈕翻頁。每頁是一個主題，內容較長時可以往下滑。</p>`],
['ICC 在記錄什麼？',`<p class="lead">從一場海岸清理，走向共同記錄、追查源頭的國際行動。</p><p>ICC 是 International Coastal Cleanup，中文為「國際淨灘行動」。它把淨灘與記錄連在一起：清掉垃圾，也留下能用來理解問題的資料。</p><h2>1986｜從美國德州發起</h2><p>Linda Maraniss 與 Kathy O’Hara 串連地方政府、企業和志工，發起 Ocean Conservancy 的第一場淨灘。參與者除了撿拾，也以標準記錄卡登記物品，思考如何讓垃圾不再進入海洋。</p><h2>1989｜加拿大、墨西哥加入成國際行動</h2><p>這套方法逐步成為國際行動，各地參與者以淨灘與資料記錄，支持海洋廢棄物的研究、教育與減量倡議。並於每年的國際淨灘⽇（9⽉的第三個星期六）動員各地志⼯進⾏淨灘活動。</p><h2>2005｜黑潮引入方法在臺灣推廣</h2><p>黑潮引入 ICC 國際淨灘監測方法，在花蓮、基隆、台北、新⽵、苗栗、嘉義、屏東等地，共10個⺠間團體參與淨灘監測活動，持續記錄海岸垃圾的種類與數量。</p><h2>2010 起｜串連夥伴，延伸海廢行動</h2><p>黑潮與荒野保護協會、環境資訊協會、臺南社區大學及國立海洋科技博物館等夥伴，推動臺灣清淨海洋行動聯盟（TOCA）。後續也透過島航塑膠微粒調查、花蓮溪口海廢調查及海廢快篩等工作，讓觀察與數據成為討論源頭管理的基礎。</p><p class="source-links"><a href="https://oceanconservancy.org/work/plastics/cleanups-icc/" target="_blank" rel="noopener noreferrer">Ocean Conservancy 官網｜ICC 國際淨灘行動 ↗</a><br><a href="https://www.kuroshio.org.tw/newsite/article02.php?class_item_id=107" target="_blank" rel="noopener noreferrer">黑潮官網｜黑潮簡介 ↗</a></p><h2>種類與數量</h2><p>本次依「臺灣國際淨灘行動記錄表」，分別記下各類廢棄物數量，共20種廢棄物需要記錄。</p><h2>重量</h2><p>結束後依現場指示，分一般垃圾與資源回收秤重。</p><div class="box">數量和重量回答不同問題。例如體積小、重量輕的物品，也可能有很多件。</div><h2>資料能告訴我們什麼？</h2><p>可用來認識垃圾組成，討論消費、遊憩、漁業或河川輸送等可能來源，並思考生活與制度上的改善。</p><div class="box notice">不同活動的人數、時間、範圍與潮汐可能不同。不能只看一次淨灘的數量或重量，就認定污染變嚴重，或判斷哪個海岸最髒。</div><h2>一起想想</h2><p>如果某類垃圾最多，能直接認定它來自哪裡嗎？先留下觀察，再討論可能原因。</p>`],
['五大類型與 20 種廢棄物',`<p class="lead">從垃圾的用途，連回人的使用行為。</p><p>這些分類不只是塑膠、玻璃或金屬等材質，而是幫助我們追問：誰在什麼活動中使用它？使用後，它可能怎麼來到海灘？</p><div class="box"><strong>先看關係，再記代號</strong><p>例如，吸管和飲料杯的材質可能不同，卻都能連結飲食與遊憩行為；魚線和漁網則連結漁業與休閒漁釣。</p></div>${wasteTypes.map(t=>`<section class="type-section"><h2>${t.title}</h2><p>${t.relation}</p>${t.codes?[...t.codes].map(code=>`<div class="row"><strong>${code}</strong><span>${categories[code.charCodeAt(0)-65]}${'ABCDHJKL'.includes(code)?' ♻️':''}${categoryNotes[code]?`<small class="category-note">ℹ️ ${categoryNotes[code]}</small>`:''}</span></div>`).join(''):'<p>這是紙本記錄表可增補的關注類型；目前 Bot 沒有這一類的固定代號。</p>'}</section>`).join('')}<div class="box"><p>若淨灘過程有發現值得增加記錄的廢棄物，請先另外透過手機、筆記本記錄廢棄物與數量，最後秤重結算時，一併提供給講師。</p></div><h2>從物件追問使用者的關係</h2><p>看到一個飲料杯，處了記錄外，你也可以思考它是人遺留下來的？還是隨河流、海浪帶來的？哪些人最可能會讓垃圾遺留在海岸？</p><p>需要留意，物品用途能提供線索，但不代表我們確認是誰丟的，也無法僅憑一件物品、一次記錄就認定來源。</p>`],
['怎麼分類與計數？',`<p class="lead">先辨識用途，再對照類別；分類與計數採同一套原則。</p><h2>先掌握三個記錄原則</h2><ol><li><strong>列在清單內才登錄數量。</strong>清單以外的人為垃圾，仍依安全與清運指示撿拾，但不硬塞進其他類別。</li><li><strong>破碎物先看完整程度。</strong>依既有訓練教材，完整程度不足 50%，或無法辨識的物品，不登錄件數；仍依安全原則清理。</li><li><strong>天然物留在原地。</strong>漂流木、樹葉、海藻等不當作垃圾清走。</li></ol><div class="box"><strong>ICC 分類 ≠ 資源回收分類</strong><p>ICC 分類看物品用途；一般垃圾與資源回收怎麼分袋，另依現場工作人員指示。</p></div><details><summary>查閱完整 A–T 分類對照（20 類）</summary>${wasteTypes.map(t=>`<section><h2>${t.title}</h2>${t.codes?[...t.codes].map(code=>`<div class="row"><strong>${code}</strong><span>${categories[code.charCodeAt(0)-65]}</span></div>`).join(''):'<p>本次 Bot 無固定代號；另行記錄物品與數量，結算時提供講師。</p>'}</section>`).join('')}</details><h2>先判斷，再聽講師解答</h2><section class="quiz-question quiz-tone-1"><h3>第 1 題｜一個清潔劑空瓶，該記哪一類？</h3><details><summary>看第 1 題答案</summary><p>D 非食物的瓶罐與容器。</p></details></section><section class="quiz-question quiz-tone-0"><h3>第 2 題｜一把免洗湯匙，該記哪一類？</h3><details><summary>看第 2 題答案</summary><p>I 免洗餐具。</p></details></section><section class="quiz-question quiz-tone-1"><h3>第 3 題｜8片無法辨識用途的玻璃碎片，如何記錄？</h3><details><summary>看第 3 題答案</summary><p>完整度不足 50％ 不需要記錄，依安全原則處理。</p></details></section><section class="quiz-question quiz-tone-0"><h3>第 4 題｜一個含塑膠瓶蓋的寶特瓶，怎麼回報、記錄？</h3><details><summary>看第 4 題答案</summary><p>如果寶特瓶與瓶蓋本來就在一起，只記 A 寶特瓶即可；如果是分開的狀態下被撿拾，才分開記錄 A 寶特瓶與 B 塑膠瓶蓋。</p></details></section><section class="quiz-question quiz-tone-1"><h3>第 5 題｜一個菸盒，該記哪一類？</h3><details><summary>看第 5 題答案</summary><p>不需要記錄，依安全原則清除。</p></details></section><p>漁網繩子等特殊物品的計數單位，或任何無法判斷的情況，先詢問講師，不自行猜測。</p>`],
['活動流程與小組分工',`<p class="lead">先知道自己負責什麼，再開始行動。</p><p>操作 ICC 淨灘每一組合適的人數為 10～15 人，可於活動前事先分組，或依當日活動人數進行分組。</p><h2>ICC 淨灘人員角色</h2><ol><li><strong>帶領人（講師）：</strong>講解並引導參與者操作 ICC 淨灘流程。</li><li><strong>工作人員（助教）：</strong>實際淨灘過程中，有記錄、分類問題，可提供諮詢。</li><li><strong>記錄員：</strong>由各組指定一人負責，用 LINE Bot 記錄並確認回覆。</li><li><strong>組員：</strong>負責撿拾廢棄物並回報；協助拿一般垃圾袋、資源回收袋及麻布袋；合作完成廢棄物搬運、秤重等任務。</li></ol><div class="box">集合說明 → 分組與操作確認 → 淨灘及記錄 → 分類秤重 → 結果分享</div><p>開始前請確認：自己的組別、活動範圍、結束時間與集合位置。</p>`],
['小組怎麼配合記錄？',`<p class="lead">報新增數量，確認收到，避免重複。</p><ol><li>撿拾者回報「廢棄物類別＋數量」。</li><li>紀錄員複誦後輸入 Bot，Bot 回傳後即完成一筆記錄。</li><li>撿拾者再依一般垃圾、資源回收或玻璃瓶分類放進相應的袋子中。</li></ol><p>淨灘過程請由指定紀錄員統一輸入。</p>`],
['結束後要做什麼？',`<p class="lead">先整理，再秤重，最後一起看結果。</p><ol><li>淨灘時間結束時，請跟隨講師與工作人員，帶著器材與廢棄物離開海岸。</li><li>各組就定位後，請組員開始整理一般垃圾與資源回收，將垃圾袋打結綁好，比較好秤重。</li><li>開始秤重前，請紀錄員將 LINE Bot 輸入「開始秤重」；請組員確認吊秤單位為「公斤 / kg」。</li><li>組員開始將一般垃圾與資源回收逐袋秤重，並回報重量，記錄員將每一袋重量依類型如時記錄。</li><li>秤重時務必留意，沒有漏記或重複秤重記錄。</li></ol><h2>紀錄員的秤重步驟</h2><p><code>開始秤重</code> → <code>一般垃圾</code> 或 <code>資源回收</code> → 逐袋輸入重量（公斤）→ <code>完成秤重</code></p><div class="box"><strong>離開前再次確認</strong><ul><li>組別正確。</li><li>各類廢棄物數量無遺漏。</li><li>每一袋廢棄物重量無遺漏。</li><li>已輸入「完成秤重」，並查看小結。</li></ul></div><h2>帶一個觀察回來</h2><p>哪一類垃圾令你意外？你觀察到什麼，還需要哪些資料才能解釋它？</p>`],
['淨灘範圍與安全',`<p class="lead">先確認現場界線，再開始撿拾。</p><div class="box notice">活動範圍、集合時間、集合位置及求助對象，以當天講師宣布為準。</div><ul><li>行走時抬頭看路；停下來再查看手機。</li><li>適時補充飲水、做好防曬 / 保暖。</li><li>正確使用工具，留意腳下地形，並與海浪保持距離。</li><li>針頭、魚鉤、尖銳物、不明容器或其他不確定物品，可諮詢工作人員處理方式；保特瓶內有液體時，不要開啟倒出，直接丟入一般垃圾袋。</li><li>碎玻璃、衛生用品與動物屍體，不徒手接觸，若清理困難，不勉強處理。</li><li>過重、卡住或需要冒險才能撿拾、搬運的廢棄物，不勉強處理。</li><li>發現鳥巢或鳥蛋時，保持距離、不觸碰，周邊廢棄物不撿拾，先留在原地。</li><li>身體不適、受傷或需離隊時，務必通知工作人員與同組夥伴。</li></ul><p>雨勢、雷擊、浪況或其他風險出現時，依講師指示調整、縮短或停止活動。</p>`],
['LINE Bot 怎麼操作？',`<p class="lead">各組「記錄員」請繼續以下操作。</p><p><strong>組員可瀏覽，操作本頁練習，但請勿操作 LINE Bot，以免重複登記數量。</strong></p><a class="cta" href="https://line.me/R/ti/p/%40739nlazz" target="_blank" rel="noopener noreferrer">開啟黑潮 ICC 淨灘記錄</a><p>若連結未開啟，請在 LINE 搜尋 ID：<code>@739nlazz</code>。</p><ol><li>輸入 <code>開始</code>。</li><li>依提示選擇自己的組別，核對場次名稱。</li><li>輸入類別與新增數量，例如 <code>P 15</code> 或 <code>打火機 15</code>。</li><li>查看 Bot 回覆，確認成功記錄。</li></ol><h2>記錯怎麼辦？</h2><p>例如多記了 3 個打火機，輸入 <code>P -3</code> 扣回，再核對回覆。</p><p>若 Bot 正在等待其他輸入，可先傳 <code>取消</code>，再重新輸入。</p><h2>查詢指令</h2><p><code>垃圾清單</code>：看類別代號。<br><code>查詢第1組</code>：查第 1 組數量；請改成自己的組別。</p><h2>先在這裡練一次</h2><p>情境：第 2 組記了 15 個打火機，後來發現多記了 3 個。試著完成記錄、修正與查詢。</p><div class="practice"><p><strong>網頁模擬練習</strong><br>不連線 LINE，不寫入正式資料。</p><ol><li><code>開始</code></li><li><code>第2組</code></li><li><code>P 15</code></li><li><code>P -3</code></li><li><code>查詢第2組</code></li></ol><form id="practice-form"><label for="command">輸入上方練習指令</label><div class="input-row"><input id="command" autocomplete="off" placeholder="例如：開始" maxlength="40"><button type="submit">送出練習</button></div></form><p id="practice-reply" role="status" aria-live="polite">等你輸入「開始」。</p><button id="reset-practice" type="button">重新練習</button></div><div class="box notice">模擬練習完成後，才切到真正的 LINE Bot 選擇自己的組別。正式 Bot 會寫入活動資料，請不要送出示範數量。</div><p>沒有回覆或數量不確定時，先確認資料是否已寫入，不要連續重送同一筆。</p>`]

];
const content=document.querySelector('#content'), menu=document.querySelector('#menu'), toggle=document.querySelector('#toggle');
menu.innerHTML=pages.map((p,i)=>`<button data-page="${i+1}">${String(i+1).padStart(2,'0')}　${p[0]}</button>`).join('');
// 以網址片段保存頁碼，支援重整、分享及瀏覽器上一頁。
let practiceState={started:false,group:false,count:0};
function setupPractice(){const form=document.querySelector('#practice-form');if(!form)return;practiceState={started:false,group:false,count:0};const reply=document.querySelector('#practice-reply');document.querySelector('#reset-practice').onclick=()=>{practiceState={started:false,group:false,count:0};form.reset();reply.textContent='已重設。請輸入「開始」。'};form.onsubmit=e=>{e.preventDefault();const input=document.querySelector('#command');const value=input.value.trim();let msg='這個練習只支援上方五個指令，請依序操作。';if(value==='開始'){practiceState.started=true;msg='請輸入「第2組」。'}else if(value==='第2組'&&practiceState.started){practiceState.group=true;msg='已選第 2 組（模擬）。請輸入 P 15。'}else if(/^P\s+-?\d+$/i.test(value)&&practiceState.group){const amount=Number(value.split(/\s+/)[1]);if(practiceState.count+amount<0){msg='扣除數量超過目前累計，請核對。'}else{practiceState.count+=amount;msg='第 2 組：打火機 '+(amount>=0?'+':'')+amount+'，目前累計 '+practiceState.count+' 個（模擬）。'}}else if(value==='查詢第2組'&&practiceState.group){msg='第 2 組：打火機 '+practiceState.count+' 個（模擬）。'+(practiceState.count===12?'正確！15 減 3，結果為 12。':'請核對是否完成記錄 15 個、扣回 3 個。');}reply.textContent=msg;input.value='';};}
function current(){const n=Number(location.hash.slice(1));return Number.isInteger(n)&&n>=1&&n<=pages.length?n:1}
function render(){const n=current();content.innerHTML=`<div class="eyebrow">主題 ${String(n).padStart(2,'0')} / ${pages.length}</div><h1 tabindex="-1">${pages[n-1][0]}</h1>${pages[n-1][1]}<p class="draft">學生教學版 · 依黑潮既有訓練教材整理 · 現場安排以講師說明為準</p>`;document.querySelector('#progress').textContent=`${n} / ${pages.length}`;document.querySelector('#prev').disabled=n===1;document.querySelector('#next').disabled=n===pages.length;menu.hidden=true;toggle.setAttribute('aria-expanded','false');window.scrollTo(0,0);setupPractice()}
function go(n){if(n>=1&&n<=pages.length){if(current()===n){render()}else location.hash=String(n);content.querySelector('h1')?.focus({preventScroll:true})}}
document.querySelector('#prev').onclick=()=>go(current()-1);document.querySelector('#next').onclick=()=>go(current()+1);toggle.onclick=()=>{menu.hidden=!menu.hidden;toggle.setAttribute('aria-expanded',String(!menu.hidden))};menu.onclick=e=>{const b=e.target.closest('[data-page]');if(b)go(Number(b.dataset.page))};window.addEventListener('hashchange',()=>{render();content.querySelector('h1').focus({preventScroll:true})});render();
</script></body></html>
